<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 适老化：不禁止缩放（允许用户手动放大），viewport 仅定宽度 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园互助 · 退休教职工端</title>
<style>
/* ============================================================
   校园互助平台 · 退休教职工适老化端（单文件 SPA，零依赖）
   规范依据：工信部《移动互联网应用（APP）适老化通用设计规范》(2021)
   —— 大图标 / 高对比度 / 大字号 / 大行距 / 大点击区（≥88px）/ 流程极简
   页面：登录 / 首页 / 求助（语音优先）/ 我的工单 / 工单详情
   ============================================================ */
:root{
  /* 高对比浅色系：米白底 + 近黑字（对比度 > 7:1），操作按钮高饱和 */
  --bg:#f7f3ec;         /* 米白底，比纯白柔和防眩光 */
  --ink:#1c1c1c;        /* 近黑正文 */
  --ink2:#5a564e;       /* 次级深灰（仍保持高对比） */
  --panel:#ffffff;
  --line:#c9c2b4;
  --line-soft:#e8e1d2;  /* 更浅的分隔线（信息行用） */
  /* 品牌统一：主操作按钮改用三端一致的「青松」深青（与白字对比度仍 > 5.5:1，符合适老化） */
  --primary:#0c6b60;    /* 深青松（主操作，比默认蓝更契合品牌，对比度达标） */
  --primary-dk:#09524a;
  --ok:#1a7f37;         /* 绿：确认/成功 */
  --warn:#b45309;       /* 橙：普通紧急 */
  --danger:#c22525;     /* 红：特急/拦截 */
  --r:16px;             /* 圆角 */
  --shadow:0 4px 14px rgba(60,50,30,.10);   /* 统一柔和投影 */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:22px}                       /* 适老化基准字号放大 */
body{
  background:var(--bg);color:var(--ink);
  font-family:"Microsoft YaHei",system-ui,sans-serif;
  line-height:1.8;                          /* 大行距 */
  max-width:640px;margin:0 auto;            /* 手机/平板居中 */
  min-height:100vh;
}
h1,h2,h3{line-height:1.4}
button{font-family:inherit;cursor:pointer;border:none}
/* 焦点可见（键盘/读屏用户） */
:focus-visible{outline:4px solid var(--primary);outline-offset:2px}

/* ---------- 通用布局 ---------- */
.wrap{padding:24px 20px 130px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:18px 20px;background:var(--panel);border-bottom:2px solid var(--line);
  position:sticky;top:0;z-index:10;box-shadow:var(--shadow)}
.top .t{font-size:36px;font-weight:800;letter-spacing:2px}
.top .tbtns{display:flex;gap:14px}
.top button{font-size:28px;padding:12px 24px;min-height:76px;border-radius:12px;
  background:#eee9dd;color:var(--ink);font-weight:700}
.top button:active{background:#ded7c4}

/* 子页通用标题行：大标题独占一行，防与返回按钮重叠 */
.pagehead{display:flex;flex-direction:column;gap:6px;margin:26px 0 6px}
.pagehead h2{font-size:44px;font-weight:800}

/* ---------- 大卡片 / 表单 ---------- */
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);
  padding:28px;margin-bottom:26px;box-shadow:var(--shadow)}
.card h2{font-size:38px;margin-bottom:14px}
.label{font-size:28px;font-weight:700;margin:16px 0 8px;display:block}
input,textarea{
  width:100%;font-size:30px;padding:18px 20px;          /* 大输入区 */
  border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);
  font-family:inherit;
}
input:focus,textarea:focus{border-color:var(--primary)}
textarea{min-height:140px;resize:vertical}

/* ---------- 超大按钮（点击区 ≥ 96px 高） ---------- */
.bigbtn{
  display:flex;align-items:center;justify-content:center;gap:14px;
  width:100%;min-height:104px;font-size:36px;font-weight:800;
  border-radius:var(--r);color:#fff;background:var(--primary);
  margin-top:18px;box-shadow:var(--shadow);
}
.bigbtn:active{background:var(--primary-dk)}
.bigbtn.ok{background:var(--ok)}
.bigbtn.warn{background:var(--warn)}
.bigbtn.ghost{background:#eee9dd;color:var(--ink);border:2px solid var(--line)}

/* ---------- 首页大图标按钮 ---------- */
.menu{display:flex;flex-direction:column;gap:24px;margin-top:30px}
.menu button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:220px;border-radius:24px;border:3px solid var(--line);
  font-size:40px;font-weight:700;color:var(--ink);background:var(--panel);
}
.menu .ico{font-size:80px;line-height:1}   /* 大图标 */
.menu .b1{background:#eaf2fc;border-color:var(--primary)}
.menu .b2{background:#f3f7ee;border-color:#4a7c2f}
.menu .b3{background:#fdf6e8;border-color:#b45309}
.menu .b2{background:#eef8ef;border-color:var(--ok)}

/* ---------- 语音按钮 ---------- */
.mic{
  width:220px;height:220px;border-radius:50%;          /* 圆形大麦克风 */
  background:var(--primary);color:#fff;font-size:30px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  margin:24px auto;user-select:none;touch-action:none;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
}
.mic .ico{font-size:72px;line-height:1}
.mic.rec{background:var(--danger);animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ---------- 工单卡片（列表） ---------- */
.order{
  display:block;width:100%;text-align:left;background:var(--panel);
  border:3px solid var(--line);border-radius:var(--r);padding:26px;margin-bottom:22px;
  box-shadow:var(--shadow);
}
.order:active{background:#faf7f0}
.order .ttl{font-size:32px;font-weight:700;margin-bottom:8px}
.order .meta{font-size:26px;color:var(--ink2)}
.order .st{float:right;font-size:26px;font-weight:700;padding:6px 18px;border-radius:999px;color:#fff}
.st.published{background:var(--primary)} .st.accepted{background:var(--warn)}
.st.completed{background:var(--ok)}      .st.evaluated{background:var(--ok)}
.st.blocked{background:var(--danger)}    .st.pending_manual_review{background:#8a6d00}
.st.ai_reviewing{background:#666}        .st.matching{background:var(--primary)}
.st.in_progress{background:var(--warn)}  .st.created{background:#666}
.st.cancelled{background:#999}

/* ---------- 详情信息行：实线浅分隔 + 行距加大 ---------- */
.kv{display:flex;font-size:30px;padding:18px 0;border-bottom:2px solid var(--line-soft)}
.kv:last-child{border-bottom:none}
.kv .k{width:200px;flex:none;color:var(--ink2);font-weight:700}
.kv .v{flex:1;word-break:break-all}
.stblock{font-size:44px;font-weight:800;text-align:center;padding:26px;border-radius:var(--r);
  background:var(--panel);border:3px solid var(--line);margin-bottom:26px;
  box-shadow:var(--shadow);border-left:12px solid var(--primary)}   /* 左侧色条强调状态 */

/* ---------- 徽标（与平台统一：L1绿/L2黄/L3红/官方暖沙金） ---------- */
.badge{display:inline-block;font-size:26px;font-weight:700;color:#fff;
  padding:6px 18px;border-radius:999px;margin-right:10px}
.b-official{background:#8a6417} .b-L1{background:#1a7f37}
.b-L2{background:#c07f00}       .b-L3{background:#c22525}

/* ---------- 星级（评价用，大星星） ---------- */
.stars{display:flex;justify-content:center;gap:14px;margin:26px 0}
.stars button{font-size:72px;background:none;color:#cfc8b8}
.stars button.on{color:#c8963c} /* 星级暖沙金，与平台点缀色统一 */

/* ---------- 提示 / 弹窗（大字版） ---------- */
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);
  background:rgba(20,20,20,.92);color:#fff;font-size:30px;padding:20px 34px;
  border-radius:14px;display:none;z-index:99;max-width:88%;text-align:center;line-height:1.5}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
  align-items:center;justify-content:center;z-index:98;padding:24px}
#modal{background:#fff;border-radius:20px;padding:34px 28px;max-width:560px;width:100%;
  max-height:86vh;overflow:auto;text-align:center}
#modal h3{font-size:40px;margin-bottom:16px}
#modal p{font-size:30px;text-align:left}
#modal .bigbtn{margin-top:26px}

/* 选项大按钮组（改类型/紧急度用） */
.opts{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0}
.opts button{font-size:30px;font-weight:700;padding:20px 28px;min-height:80px;
  border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink)}
.opts button.on{background:var(--primary);color:#fff;border-color:var(--primary)}

.hint{font-size:26px;color:var(--ink2);margin-top:10px}
.center{text-align:center}
</style>
</head>
<body>
<!-- 顶部栏（登录后显示）：返回 + 标题 + 退出 -->
<div class="top" id="topbar" style="display:none">
  <button id="btnBack" onclick="goBack()" style="display:none">← 返回</button>
  <div class="t">校园互助</div>
  <div class="tbtns">
    <button onclick="logout()">退出</button>
  </div>
</div>

<div class="wrap" id="view"></div>

<div id="toast"></div>
<div id="mask"><div id="modal"></div></div>

<script>
'use strict';
/* ============================================================
   适老化端 SPA（hash 路由，无刷新切页）
   页面：#/login 登录 · #/home 首页 · #/ask 求助 · #/mine 我的工单
        #/credit 我的信用 · #/order/:id 工单详情
   接口约定与学生端一致（Bearer token，前缀 /api/v1）
   ============================================================ */
const API = '/api/v1';
const $ = s => document.querySelector(s);
const view = $('#view');

/* ---------- 统一请求封装：自动带 token；401 清登录态回登录页 ---------- */
async function api(path, opt = {}){
  const token = localStorage.getItem('token');
  const headers = {'Content-Type':'application/json'};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(API + path, {...opt, headers,
    body: opt.body ? JSON.stringify(opt.body) : undefined});
  if (r.status === 401){ logout(); throw new Error('登录已过期'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('请求失败 ' + r.status));
  return data;
}
function logout(){
  localStorage.removeItem('token'); localStorage.removeItem('user');
  location.hash = '#/login';
}
/* 登录守卫：未登录一律回登录页 */
function requireLogin(){
  if (!localStorage.getItem('token')){ location.hash = '#/login'; return false; }
  return true;
}

/* ---------- 转义用户内容，防 XSS ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- toast 大字轻提示 / 大字弹窗 ---------- */
let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 3200);
}
function openModal(html){ $('#modal').innerHTML = html; $('#mask').style.display = 'flex'; }
function closeModal(){ $('#mask').style.display = 'none'; }
$('#mask').addEventListener('click', e => { if (e.target.id === 'mask') closeModal(); });

/* ---------- 枚举映射（对齐后端 DTO） ---------- */
const STATUS = {created:'待发布', published:'已发布', accepted:'学生已接单',
  in_progress:'进行中', completed:'已完成', evaluated:'已评价',
  blocked:'已拦截', pending_manual_review:'待人工复核', ai_reviewing:'审核中',
  matching:'匹配中', cancelled:'已取消'};
const TYPES = ['学业答疑','生活互助','后勤服务','代办跑腿','设备维修','搬运协助','其他'];
const URGS  = ['低','普通','特急'];
const stTxt = s => STATUS[s] || s;
/* 求助内容展示：优先 description，退回 transcript */
const descOf = o => o.description || o.transcript || '';

/* ============================================================
   返回导航：history.back() 兜底 #/home（老用户浏览器返回栈不可靠，
   统一给一个确定能回去的入口）
   ============================================================ */
function goBack(){
  if (history.length > 1) history.back();
  else location.hash = '#/home';
}

/* ============================================================
   路由：hash 变化 → 渲染对应页面
   ============================================================ */
window.addEventListener('hashchange', route);
function route(){
  const h = location.hash || '#/login';
  const logged = !!localStorage.getItem('token');
  const isHome = h === '#/home';
  $('#topbar').style.display = (logged && h !== '#/login') ? 'flex' : 'none';
  /* 顶部返回按钮：仅子页显示（首页是根，无上一页） */
  $('#btnBack').style.display = (logged && !isHome && h !== '#/login') ? 'block' : 'none';
  if (h.startsWith('#/order/')){
    if (requireLogin()) return pgOrder(h.split('/')[2]);
    return;
  }
  if (h === '#/login'){ if (logged){ location.hash = '#/home'; return; } return pgLogin(); }
  if (!requireLogin()) return;
  if (h === '#/home')  return pgHome();
  if (h === '#/ask')   return pgAsk();
  if (h === '#/mine')  return pgMine();
  if (h === '#/credit') return pgCredit();
  location.hash = '#/home';
}

/* ============================================================
   页面 1：登录（大输入框；预填演示账号方便体验）
   ============================================================ */
function pgLogin(){
  view.innerHTML = `
    <div class="center" style="margin:60px 0 10px">
      <div style="font-size:96px">🤝</div>
      <h1 style="font-size:52px;margin-top:10px">校园互助平台</h1>
      <p class="hint" style="font-size:30px">退休教职工服务端</p>
    </div>
    <div class="card" style="margin-top:30px">
      <label class="label" for="lu">账号</label>
      <input id="lu" value="stu01" autocomplete="username" style="font-size:34px">
      <label class="label" for="lp">密码</label>
      <input id="lp" type="password" value="123456" autocomplete="current-password" style="font-size:34px">
      <button class="bigbtn ok" id="lgbtn">登 录</button>
      <p class="hint center">演示账号：stu01 / 123456</p>
    </div>`;
  const doLogin = async () => {
    const username = $('#lu').value.trim(), password = $('#lp').value;
    if (!username || !password) return toast('请输入账号和密码');
    $('#lgbtn').textContent = '登录中…';
    try{
      const d = await api('/users/login', {method:'POST', body:{username, password}});
      localStorage.setItem('token', d.token);
      localStorage.setItem('user', JSON.stringify(d.user || {}));
      location.hash = '#/home';
    }catch(e){
      $('#lgbtn').textContent = '登 录';
      toast(e.message);                 // 登录失败：大字 toast 提示
    }
  };
  $('#lgbtn').onclick = doLogin;
  $('#lp').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
}

/* ============================================================
   页面 2：首页（大图标两个入口，流程极简）
   ============================================================ */
function pgHome(){
  const u = JSON.parse(localStorage.getItem('user') || '{}');
  view.innerHTML = `
    <div class="center" style="margin-top:34px">
      <div style="font-size:88px">👵</div>
      <h1 style="font-size:46px">您好，${esc(u.real_name || u.username || '老师')}</h1>
      <p class="hint" style="font-size:30px">信用分 ${esc(u.credit_score ?? '-')} 分</p>
    </div>
    <div class="menu">
      <button class="b1" id="m-ask">
        <span class="ico">🗣️</span>我要求助<br><span style="font-size:28px;font-weight:400">按住说话就能发</span>
      </button>
      <button class="b2" id="m-mine">
        <span class="ico">📋</span>我的工单<br><span style="font-size:28px;font-weight:400">看看进展</span>
      </button>
      <button class="b3" id="m-credit">
        <span class="ico">⭐</span>我的信用<br><span style="font-size:28px;font-weight:400">互助得星星</span>
      </button>
    </div>
    <p class="hint center" style="margin-top:34px">遇到紧急情况请直接拨打校内服务电话</p>`;
  $('#m-ask').onclick  = () => location.hash = '#/ask';
  $('#m-mine').onclick = () => location.hash = '#/mine';
  $('#m-credit').onclick = () => location.hash = '#/credit';
}

/* ============================================================
   页面 3：求助发布（语音优先，文字兜底；核心流程语音操作）
   语音：MediaRecorder 录音 → base64 → POST /ai/asr → 回显
   ============================================================ */
let draft = null;      // 解析回显后的可编辑工单草稿
let recorder = null, chunks = [], holdTimer = null;

function pgAsk(){
  view.innerHTML = `
    <div class="pagehead"><h2>我要求助</h2></div>
    <div class="card center" id="voiceCard">
      <h2>按住下面按钮说话</h2>
      <p class="hint">说清楚：什么时候、在哪儿、需要什么帮助</p>
      <button class="mic" id="mic"><span class="ico">🎤</span><span id="micTxt">按住说话</span></button>
      <div id="recState" class="hint"></div>
      <div style="margin-top:8px"><button class="bigbtn ghost" id="typeMode">不会说？打字求助</button></div>
    </div>
    <div class="card" id="typeCard" style="display:none">
      <h2>打字求助</h2>
      <textarea id="typeText" placeholder="例如：明天上午请人帮我在图书馆取一份资料"></textarea>
      <button class="bigbtn" id="typeGo">识别一下</button>
      <button class="bigbtn ghost" id="backVoice">返回语音</button>
    </div>
    <div id="confirmBox"></div>`;
  bindMic();
  $('#typeMode').onclick = () => {
    $('#typeCard').style.display = 'block'; $('#voiceCard').style.display = 'none';
  };
  $('#backVoice').onclick = () => {
    $('#typeCard').style.display = 'none'; $('#voiceCard').style.display = 'block';
  };
  $('#typeGo').onclick = async () => {
    const text = $('#typeText').value.trim();
    if (!text) return toast('请先输入求助内容');
    try{ await parseAndShow(text); }        // 文本 → 解析 → 可编辑回显
    catch(e){ toast(e.message); }
  };
}

/* ---------- 语音录入：按住录、松开识别 ---------- */
function bindMic(){
  const mic = $('#mic');
  const start = async e => {
    e.preventDefault();
    if (recorder) return;
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      recorder = new MediaRecorder(stream);          // 零依赖原生录音
      chunks = [];
      recorder.ondataavailable = ev => chunks.push(ev.data);
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, {type: recorder.mimeType || 'audio/webm'});
        $('#micTxt').textContent = '按住说话';
        mic.classList.remove('rec');
        $('#recState').textContent = '识别中…';
        const b64 = await new Promise(res => {       // blob → base64（JSON 接口）
          const fr = new FileReader();
          fr.onload = () => res(String(fr.result).split(',')[1]);
          fr.readAsDataURL(blob);
        });
        try{
          const d = await api('/ai/asr', {method:'POST', body:{audio_b64: b64}});
          $('#recState').textContent = '';
          if (!d.transcript){ toast('没听清楚，请再说一次'); return; }
          await parseAndShow(d.transcript);          // 识别文本直接进解析
        }catch(e){ $('#recState').textContent = ''; toast(e.message); }
      };
      recorder.start();
      mic.classList.add('rec');
      $('#micTxt').textContent = '松开结束';
    }catch(e){ toast('无法使用麦克风，请改用打字求助'); }
  };
  const stop = e => { e.preventDefault(); if (recorder && recorder.state !== 'inactive') recorder.stop(); };
  /* 鼠标 + 触屏双支持；长按屏蔽系统菜单 */
  mic.addEventListener('mousedown', start);
  mic.addEventListener('mouseup', stop);
  mic.addEventListener('touchstart', start, {passive:false});
  mic.addEventListener('touchend', stop, {passive:false});
  mic.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---------- 解析结果回显：全部字段可点按修改（发布前核对） ---------- */
async function parseAndShow(text){
  const d = await api('/ai/parse', {method:'POST', body:{text}});   // R6/R7 槽位填充
  draft = {task_type:d.task_type, urgency:d.urgency || '普通',
           location:d.location, time_slot:d.time_slot, description:d.description || text};
  renderConfirm(text);
}
function renderConfirm(){
  const d = draft;
  $('#confirmBox').innerHTML = `
    <div class="card">
      <h2>请核对求助内容</h2>
      <p class="hint">点每一行都可以修改</p>
      <div class="kv" id="f-type"><div class="k">帮助类型</div><div class="v">${esc(d.task_type)}</div></div>
      <div class="kv" id="f-urg"><div class="k">紧急程度</div><div class="v">${esc(d.urgency)}</div></div>
      <div class="kv" id="f-loc"><div class="k">地点</div><div class="v">${esc(d.location || '未填写')}</div></div>
      <div class="kv" id="f-time"><div class="k">时间</div><div class="v">${esc(d.time_slot || '未填写')}</div></div>
      <div class="kv" id="f-desc"><div class="k">具体情况</div><div class="v">${esc(d.description)}</div></div>
      <button class="bigbtn ok" id="pub">✅ 确认发布</button>
      <button class="bigbtn ghost" id="reask">🔄 再说一次</button>
    </div>`;
  $('#f-type').onclick = pickType;
  $('#f-urg').onclick  = pickUrg;
  $('#f-loc').onclick  = editText('地点', 'location');
  $('#f-time').onclick = editText('时间', 'time_slot');
  $('#f-desc').onclick = editText('具体情况', 'description');
  $('#reask').onclick  = () => { draft = null; $('#confirmBox').innerHTML = ''; pgAsk(); };
  $('#pub').onclick    = publish;
  $('#confirmBox').scrollIntoView({behavior:'smooth'});
}

/* ---------- 字段修改（大按钮选择 / 大输入框） ---------- */
function pickType(){
  openModal(`<h3>选择帮助类型</h3>
    <div class="opts">${TYPES.map(t =>
      `<button data-v="${esc(t)}" class="${t === draft.task_type ? 'on' : ''}">${esc(t)}</button>`).join('')}</div>
    <button class="bigbtn ghost" onclick="closeModal()">取消</button>`);
  $('#modal').querySelectorAll('.opts button').forEach(b => b.onclick = () => {
    draft.task_type = b.dataset.v; closeModal(); renderConfirm();
  });
}
function pickUrg(){
  openModal(`<h3>紧急程度</h3>
    <div class="opts">${URGS.map(u =>
      `<button data-v="${esc(u)}" class="${u === draft.urgency ? 'on' : ''}">${esc(u)}</button>`).join('')}</div>
    <p class="hint">特急：马上需要；普通：今天内；低：这两天都行</p>
    <button class="bigbtn ghost" onclick="closeModal()">取消</button>`);
  $('#modal').querySelectorAll('.opts button').forEach(b => b.onclick = () => {
    draft.urgency = b.dataset.v; closeModal(); renderConfirm();
  });
}
function editText(label, key){
  return () => {
    openModal(`<h3>修改${esc(label)}</h3>
      <textarea id="ev" style="min-height:110px">${esc(draft[key])}</textarea>
      <button class="bigbtn ok" id="evok">保存</button>
      <button class="bigbtn ghost" onclick="closeModal()">取消</button>`);
    $('#evok').onclick = () => { draft[key] = $('#ev').value.trim(); closeModal(); renderConfirm(); };
  };
}

/* ---------- 确认发布：POST /orders（手工槽位优先于解析结果） ---------- */
async function publish(){
  $('#pub').textContent = '发布中…';
  try{
    const d = await api('/orders', {method:'POST', body:{
      transcript: draft.description,              // 作为转写文本存档
      task_type: draft.task_type, urgency: draft.urgency,
      location: draft.location, time_slot: draft.time_slot,
      description: draft.description,
    }});
    if (d.blocked){                                // L3 拦截：官方渠道大字指引
      const o = d.order || {};
      openModal(`<h3>⚠️ 需要通过官方渠道办理</h3>
        <p>您反映的事项（${esc(o.task_type || '相关服务')}）已由学校统一服务：</p>
        <p style="font-size:34px;font-weight:800;margin:14px 0">${esc(o.official_channel_ref || '校内后勤服务中心')}</p>
        <p class="hint">请拨打对应电话或到服务点现场办理，更安全可靠。</p>
        <button class="bigbtn ok" onclick="closeModal();location.hash='#/home'">我知道了</button>`);
      $('#pub').textContent = '✅ 确认发布';
      return;
    }
    openModal(`<h3>✅ 发布成功</h3>
      <p>已发布到任务广场，学生看到后会尽快联系。<br>可以在「我的工单」里查看进展。</p>
      <button class="bigbtn ok" onclick="closeModal();location.hash='#/mine'">看我的工单</button>
      <button class="bigbtn ghost" onclick="closeModal();location.hash='#/home'">回首页</button>`);
    $('#pub').textContent = '✅ 确认发布';
    draft = null;
  }catch(e){
    $('#pub').textContent = '✅ 确认发布';
    toast(e.message);
  }
}

/* ============================================================
   页面 4：我的工单（我发布的全部，大卡片）
   ============================================================ */
async function pgMine(){
  view.innerHTML = '<div class="card center" style="margin-top:30px;font-size:32px">加载中…</div>';
  try{
    const d = await api('/orders/mine');
    const mine = d.items.filter(o => String(o.requester_id) ===
      String((JSON.parse(localStorage.getItem('user') || '{}')).id));   // 老人端只看自己求助的
    view.innerHTML = `<div class="pagehead"><h2>我的工单（${mine.length}）</h2></div>` +
      (mine.length ? mine.map(o => `
        <button class="order" onclick="location.hash='#/order/${o.id}'">
          <span class="st ${esc(o.status)}">${esc(stTxt(o.status))}</span>
          <div class="ttl">${typeTag(o)}${esc(o.title || descOf(o).slice(0, 18))}</div>
          <div class="meta">⏰ ${esc(o.time_slot || '时间待定')} · 📍 ${esc(o.location || '地点待定')}</div>
        </button>`).join('')
      : `<div class="card center"><p style="font-size:32px">还没有求助记录</p>
         <button class="bigbtn ok" onclick="location.hash='#/ask'">去求助</button></div>`);
  }catch(e){ view.innerHTML = `<div class="card center"><p style="font-size:32px">${esc(e.message)}</p></div>`; }
}
/* 类型/风险徽标：官方蓝，L1绿/L2黄/L3红 */
function typeTag(o){
  if (o.is_official || o.task_type === '官方任务')
    return `<span class="badge b-official">官方</span>`;
  const lv = o.risk_level === 'L3' ? 'b-L3' : o.risk_level === 'L2' ? 'b-L2' : 'b-L1';
  return `<span class="badge ${lv}">${esc(o.risk_level || 'L1')}</span>`;
}

/* ============================================================
   页面 4.5：我的信用（大字显示分数 + 流水大卡片；老人只读，不做申诉）
   ============================================================ */
const EVT_TXT = {publish:'发布求助', accept:'接单互助', complete:'完成互助',
  rate:'获得评价', breach:'违约', adjust:'人工调整'};
async function pgCredit(){
  view.innerHTML = '<div class="card center" style="margin-top:30px;font-size:32px">加载中…</div>';
  const me = JSON.parse(localStorage.getItem('user') || '{}');
  let score, led;
  try{
    const c = await api('/credits/' + me.id);
    score = c.credit_score;
    led = await api(`/credits/${me.id}/ledger?size=20`);
  }catch(e){ view.innerHTML = `<div class="card center"><p style="font-size:32px">${esc(e.message)}</p></div>`; return; }
  view.innerHTML = `
    <div class="card center">
      <div style="font-size:30px;color:var(--ink2)">我的信用分</div>
      <div style="font-size:96px;font-weight:800;color:${score >= 100 ? 'var(--ok)' : score >= 80 ? '#b45309' : 'var(--danger)'}">${esc(score ?? '-')}</div>
      <p class="hint" style="font-size:28px">${score >= 100 ? '信用很好，互助优先安排 🌟' : score >= 80 ? '信用良好，继续保持' : '信用偏低，完成互助可加分'}</p>
    </div>
    <h2 style="font-size:36px;margin:6px 0 14px">得分记录</h2>
    ${(led.items || []).length ? led.items.map(it => `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:22px 26px;margin-bottom:18px">
        <div style="text-align:left">
          <div style="font-size:30px;font-weight:700">${esc(EVT_TXT[it.event] || it.event)}</div>
          <div class="hint" style="font-size:24px">${esc((it.created_at || '').replace('T', ' ').slice(0, 16))}${it.remark ? ' · ' + esc(it.remark) : ''}</div>
        </div>
        <div style="font-size:44px;font-weight:800;color:${it.delta >= 0 ? 'var(--ok)' : 'var(--danger)'}">${it.delta >= 0 ? '+' : ''}${esc(it.delta)}</div>
      </div>`).join('')
    : `<div class="card center"><p style="font-size:30px">还没有记录，完成一次互助就能得分</p></div>`}`;
}

/* ============================================================
   页面 5：工单详情（状态大字 + 信息行 + 完成后评价）
   ============================================================ */
async function pgOrder(id){
  view.innerHTML = '<div class="card center" style="margin-top:30px;font-size:32px">加载中…</div>';
  let o;
  try{ o = await api('/orders/' + id); }
  catch(e){ view.innerHTML = `<div class="card center"><p style="font-size:32px">${esc(e.message)}</p></div>`; return; }
  const me = JSON.parse(localStorage.getItem('user') || '{}');
  const mine = String(o.requester_id) === String(me.id);
  const canRate = mine && o.status === 'completed' && !o.rating;   // 我的求助完成 → 可评价
  view.innerHTML = `
    <div class="stblock" style="border-color:${o.status === 'blocked' ? 'var(--danger)' : 'var(--line)'}">
      <div style="font-size:30px;color:var(--ink2)">当前状态</div>
      <div>${esc(stTxt(o.status))}</div>
    </div>
    <div class="card">
      <h2>${typeTag(o)}${esc(o.title || '求助详情')}</h2>
      <div class="kv"><div class="k">具体情况</div><div class="v">${esc(descOf(o))}</div></div>
      <div class="kv"><div class="k">类型</div><div class="v">${esc(o.task_type)}</div></div>
      <div class="kv"><div class="k">紧急程度</div><div class="v">${esc(o.urgency || '普通')}</div></div>
      <div class="kv"><div class="k">地点</div><div class="v">${esc(o.location || '未填写')}</div></div>
      <div class="kv"><div class="k">时间</div><div class="v">${esc(o.time_slot || '未填写')}</div></div>
      <div class="kv"><div class="k">发布时间</div><div class="v">${esc((o.created_at || '').replace('T', ' ').slice(0, 16))}</div></div>
      ${o.volunteer_id ? `<div class="kv"><div class="k">帮扶学生</div><div class="v">已安排（工单 #${o.id}）</div></div>` : ''}
    </div>
    ${o.status === 'blocked' ? `
      <div class="card" style="border-color:var(--danger)">
        <h2 style="color:var(--danger)">已拦截</h2>
        <p style="font-size:30px">${esc(o.blocked_reason || '该事项需通过官方渠道办理')}</p>
        <p style="font-size:34px;font-weight:800;margin-top:12px">${esc(o.official_channel_ref || '校内后勤服务中心')}</p>
      </div>` : ''}
    ${o.rating ? `<div class="card center"><h2>我的评价</h2>
      <div style="font-size:44px;color:#c8963c">${'★'.repeat(o.rating.score)}${'☆'.repeat(5 - o.rating.score)}</div>
      <p style="font-size:30px">${esc(o.rating.comment || '')}</p></div>` : ''}
    ${canRate ? `<div class="card center"><h2>学生已完成，请评价</h2>
      <div class="stars" id="stars">${[1,2,3,4,5].map(n =>
        `<button data-n="${n}" aria-label="${n}星">★</button>`).join('')}</div>
      <button class="bigbtn ok" id="rateGo">确认评价</button></div>` : ''}`;
  if (canRate){
    let score = 5;                                   // 默认好评（大星星，可点）
    const paint = () => $('#stars').querySelectorAll('button')
      .forEach(b => b.classList.toggle('on', +b.dataset.n <= score));
    paint();
    $('#stars').querySelectorAll('button').forEach(b => b.onclick = () => { score = +b.dataset.n; paint(); });
    $('#rateGo').onclick = async () => {
      try{
        await api(`/orders/${o.id}/rate`, {method:'POST', body:{score, comment:'谢谢帮忙！'}});
        toast('评价成功，感谢反馈'); pgOrder(id);
      }catch(e){ toast(e.message); }
    };
  }
}

/* ---------- 启动 ---------- */
route();
</script>
</body>
</html>
